<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagewise — demo</title>
<!--
  Demo del subrayado y el popup fuera de Anki. Sírvela con un servidor local
  (fetch no funciona en file://):

      python3 -m http.server 8000      (desde la raíz del proyecto)
      abre http://localhost:8000/dev/demo.html

  Los datos de demo-data/ son de ejemplo, generados desde PDFs con texto
  inventado (dev/generar_demo.py).
-->
<link rel="stylesheet" href="../pagewise/web/pagewise.css">
<style>
  :root { --borde: #d0d7de; --suave: #57606a; --fondo: #f6f8fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fondo); color: #1f2328; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--borde); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
  header select { font: inherit; padding: 4px; }
  #aviso { display: none; margin: 12px 16px; padding: 10px 12px; border: 1px solid #d4a72c; background: #fff8c5; border-radius: 6px; font-size: 14px; }
  #marco { margin: 24px auto; max-width: 760px; background: #fff; border: 1px solid var(--borde); border-radius: 8px; min-height: 260px; padding: 0 16px; }
  body.movil #marco { max-width: 390px; }
  .card { font-family: Arial, sans-serif; font-size: 20px; text-align: center; color: #000; padding: 24px 0; }
  .nightMode #marco { background: #2c2c2c; border-color: #444; }
  .nightMode .card { color: #eee; }
  .cloze { font-weight: bold; color: blue; }
  .nightMode .cloze { color: #7aa7ff; }
  #registro { max-width: 760px; margin: 0 auto 24px; padding: 0 16px; font-size: 13px; color: var(--suave); }
</style>
</head>
<body>
<header>
  <h1>Pagewise · demo</h1>
  <label>Tarjeta
    <select id="tarjeta">
      <option value="basica">Básica (anverso)</option>
      <option value="reverso">Básica (reverso)</option>
      <option value="cloze">Cloze (anverso)</option>
      <option value="clozeR">Cloze (reverso)</option>
      <option value="media">Con imagen y audio</option>
    </select>
  </label>
  <label><input type="checkbox" id="movil"> Modo móvil (táctil, 390 px)</label>
  <label><input type="checkbox" id="noche"> Modo noche</label>
  <label><input type="checkbox" id="py"> Simular escritorio (pycmd)</label>
</header>
<div id="aviso">Abre esta página con un servidor local (<code>python3 -m http.server</code> desde la raíz del proyecto):
  el navegador no deja leer los JSON desde <code>file://</code>.</div>
<div id="marco"><div id="qa"></div></div>
<div id="registro"></div>

<script>
  window.PAGEWISE_BASE = 'demo-data/';
  var TARJETAS = {
    basica: '<div class="card">¿Qué arteria se palpa en el triángulo femoral?<br><br>' +
      '<small>Pista: continúa a la ilíaca externa, cerca del nervio femoral; detrás va el nervio ciático.</small></div>',
    reverso: '<div class="card">¿Qué arteria se palpa en el triángulo femoral?<hr id="answer">' +
      'La <b>arteria femoral</b>. El ventrículo izquierdo bombea a la aorta, y de ahí a la a. femoral.</div>',
    cloze: '<div class="card">La <span class="cloze" data-cloze="aorta">[...]</span> nace del ventrículo ' +
      'izquierdo; el <i>nervio ciático</i> sale por el agujero ciático mayor.</div>',
    clozeR: '<div class="card">La <span class="cloze">aorta</span> nace del ventrículo izquierdo; el ' +
      '<i>nervio ciático</i> sale por el agujero ciático mayor.<hr id="answer"></div>',
    media: '<div class="card"><img alt="aorta" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%2260%22%3E%3Crect width=%22120%22 height=%2260%22 fill=%22%23e6e8eb%22/%3E%3C/svg%3E"><br>' +
      '<a class="replay-button" href="#">▶ aorta.mp3</a> La aorta torácica da arterias intercostales.</div>'
  };
  function log(t) { document.getElementById('registro').textContent = t; }
  function mostrar() {
    document.getElementById('qa').innerHTML = TARJETAS[document.getElementById('tarjeta').value];
    if (window.Pagewise && Pagewise.run) Pagewise.run();
  }
  if (location.protocol === 'file:') document.getElementById('aviso').style.display = 'block';
  document.getElementById('tarjeta').onchange = mostrar;
  document.getElementById('movil').onchange = function () {
    document.body.classList.toggle('movil', this.checked);
    Pagewise.forceTouch(this.checked);
    mostrar();
  };
  document.getElementById('noche').onchange = function () {
    document.body.classList.toggle('nightMode', this.checked);
  };
  document.getElementById('py').onchange = function () {
    if (this.checked) {
      window.pycmd = function (msg, cb) {
        var m = JSON.parse(msg.replace(/^pagewise:/, ''));
        log('pycmd → ' + JSON.stringify(m) + (m.cmd === 'abrir' ? '  (en Anki se abriría el visor de PDF)' : ''));
        if (cb) cb({ ok: true, fuentes: [{ id: 1, nombre: 'Resultado simulado', fragmentos: [
          { p: 1, x: 'En Anki, aquí saldrían más fragmentos del índice SQLite.' }] }] });
      };
    } else delete window.pycmd;
    mostrar();
  };
  document.getElementById('qa').innerHTML = TARJETAS.basica;
</script>
<script src="../pagewise/web/pagewise.js"></script>
</body>
</html>
