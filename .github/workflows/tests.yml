# Tests automáticos en cada push y pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]   # 3.9 es el Python que trae Anki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest "reportlab<4.3; python_version < '3.10'" "reportlab; python_version >= '3.10'"
      - run: python -m pytest --lentos

  javascript:
    name: JavaScript (matcher, popup y sintaxis ES5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  movil:
    name: Móvil simulado (Chromium con emulación de Android e iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install reportlab
      - run: npm ci && npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node dev/prueba_movil.js

  anki:
    name: Anki 2.1.66 real (extremo a extremo, sin pantalla)
    runs-on: ubuntu-latest
    # Depende de descargar Anki y Qt: si falla por la infraestructura no bloquea.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxshmfence1 libgbm1
      - run: pip install "aqt[qt6]==2.1.66" "reportlab<4.3"
      - run: python dev/e2e_anki.py -q --plantillas
      - run: python dev/e2e_anki.py -q --ingles
